<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocket Familiar</title>
    <meta name="description" content="A small companion for the days you want to remember. A private journal where your familiar helps you notice what mattered — and only keeps what you approve." />
    <meta property="og:title" content="Pocket Familiar" />
    <meta property="og:description" content="A small companion for the days you want to remember. A private journal where your familiar helps you notice what mattered — and only keeps what you approve." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <main id="pf-bootstrap-fallback" style="min-height:100vh;display:grid;place-items:center;background:#f8f5ec;color:#344234;font-family:Georgia,serif;text-align:center;padding:24px">
        <div>
          <div style="font-size:28px;margin-bottom:10px">✦</div>
          <strong style="font-size:18px">Opening Pocket Familiar…</strong>
          <p id="pf-bootstrap-note" style="font:13px/1.5 system-ui,sans-serif;color:#687064;margin:8px 0 0">Preparing your journal.</p>
          <button id="pf-bootstrap-refresh" type="button" hidden onclick="location.reload()" style="margin-top:16px;border:1px solid #65715c;border-radius:999px;background:#42513f;color:#fff;padding:9px 16px;font:600 13px system-ui,sans-serif;cursor:pointer">Refresh Pocket Familiar</button>
        </div>
      </main>
    </div>
    <script>
      window.setTimeout(function () {
        var fallback = document.getElementById('pf-bootstrap-fallback');
        if (!fallback) return;
        var note = document.getElementById('pf-bootstrap-note');
        var refresh = document.getElementById('pf-bootstrap-refresh');
        if (note) note.textContent = 'This version did not finish opening. Refresh to load the current app.';
        if (refresh) refresh.hidden = false;
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
